kind: Kustomization
apiVersion: kustomize.config.k8s.io/v1beta1

resources:
  - deployments.yaml
  - services.yaml

configMapGenerator:
  - name: env-vars
    literals:
      - API_PORT=8080
      - LOGCOLLECTOR_PORT=8081
      - GIN_MODE=release
      - API_BASE_URL=http://api.flowforge.svc.cluster.local:8080/app/cicd/api
      - RUN_ONCE=true
  - name: ui-env-vars
    literals:
      - API_UPSTREAM="http://api.flowforge.svc.cluster.local:8080"
      - LOGCOLLECTOR_UPSTREAM="http://logcollector.flowforge.svc.cluster.local:8081"

secretGenerator:
  - name: common-secret-vars
    envs:
      - .env.common.k8s
  - name: api-secret-vars
    envs:
      - .env.api.k8s
  - name: logcollector-secret-vars
    envs:
      - .env.logcollector.k8s

generatorOptions:
  disableNameSuffixHash: true
